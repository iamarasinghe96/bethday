<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#b63b50" />
    <title>A little something for Beth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="preload" as="image" href="assets/card-art.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bow-layer" id="bowLayer" aria-hidden="true"></div>

    <main class="page-shell">
      <header class="page-head">
        <p class="eyebrow">A little something for</p>
        <h1>Beth <span aria-hidden="true">♥</span></h1>
      </header>

      <section class="card-stage" aria-label="Prime Video gift card">
        <div class="gift-card" id="giftCard" role="button" tabindex="0" aria-label="Flip the gift card" aria-pressed="false">
          <div class="card-face card-front">
            <img class="card-art" src="assets/card-art.svg" alt="" aria-hidden="true" />
            <p class="gift-wordmark">Gift<br />Card</p>
          </div>

          <div class="card-face card-back">
            <img class="card-art" src="assets/card-art.svg" alt="" aria-hidden="true" />

            <div class="back-inner">
              <img class="prime-logo" src="assets/prime-video.png" alt="Prime Video" width="960" height="296" />

              <div class="back-details">
                <div class="credentials" id="credentials">
                  <span class="cred-label">Username</span>
                  <span class="cred-value" id="username">••••••••••••</span>
                  <button class="cred-copy" type="button" data-copy="username" aria-label="Copy the username"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><g class="icon-copy"><rect x="7.25" y="7.25" width="9.5" height="11" rx="2.5"/><path d="M12.75 4.75V4a2 2 0 0 0-2-2H5.25a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2H4"/></g><path class="icon-check" d="m4.75 10.5 3.75 3.75 7-9"/></svg></button>

                  <span class="cred-label">Password</span>
                  <span class="cred-value" id="accountPassword">••••••••</span>
                  <button class="cred-copy" type="button" data-copy="accountPassword" aria-label="Copy the password"><svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><g class="icon-copy"><rect x="7.25" y="7.25" width="9.5" height="11" rx="2.5"/><path d="M12.75 4.75V4a2 2 0 0 0-2-2H5.25a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2H4"/></g><path class="icon-check" d="m4.75 10.5 3.75 3.75 7-9"/></svg></button>

                  <span class="cred-label cred-profile-label">Profile</span>
                  <span class="cred-value cred-profile-value" id="profile">1</span>

                  <span class="cred-hint">Tap to open your gift</span>
                  <button class="cred-unlock" id="unlockTrigger" type="button" aria-label="Open your gift and reveal the account details"></button>
                </div>

                <div class="unlocked-details" id="unlockedDetails">
                  <a class="prime-login" id="primeLogin" href="https://www.amazon.com.au/ap/signin?openid.pape.max_auth_age=0&amp;openid.return_to=https%3A%2F%2Ffe.primevideo.com%2Fauth%2Freturn%3F_t%3D1sg8pihkSHI9hRGXbrYwIqm6G6Ox7RtdgdJ_um0ol-sFUCAAAAAQAAAABqrg5VcmF3AAAAAPgWC9WfHH8iB-olH_E9xQ%26ref_%3Dav_auth_ap%26location%3D%2F%3Fref_%253Datv_auth_pre&amp;openid.identity=http%3A%2F%2Fspecs.openid.net%2Fauth%2F2.0%2Fidentifier_select&amp;openid.assoc_handle=amzn_prime_video_sso_aus&amp;openid.mode=checkid_setup&amp;countryCode=AU&amp;siteState=356-7994393-7486213&amp;language=en_US&amp;openid.claimed_id=http%3A%2F%2Fspecs.openid.net%2Fauth%2F2.0%2Fidentifier_select&amp;openid.ns=http%3A%2F%2Fspecs.openid.net%2Fauth%2F2.0" target="_blank" rel="noopener noreferrer">
                    <span class="prime-login-text">Log in to Prime Video</span>
                    <span class="prime-login-arrow" aria-hidden="true">↗</span>
                  </a>
                </div>
              </div>
            </div>

            <span class="card-sheen" aria-hidden="true"></span>
          </div>
        </div>
      </section>

      <footer class="page-foot">
        <p class="hint" id="hint" aria-live="polite">Tap the card to reveal your surprise</p>
        <button class="report-link" id="reportTrigger" type="button" hidden>Something not working?</button>
        <p class="signature">With love, Guvani &amp; Indika</p>
      </footer>
    </main>

    <dialog class="modal" id="accountDialog" aria-labelledby="dialogTitle">
      <form method="dialog" class="dialog-card">
        <button class="close" value="cancel" aria-label="Close">&times;</button>

        <div class="dialog-head">
          <div class="heart-mark" aria-hidden="true">♥</div>
          <h2 id="dialogTitle">Your Prime Video gift</h2>
          <p class="dialog-copy" id="dialogCopy">Choose what you&rsquo;d like to do.</p>
        </div>

        <div class="panel dialog-actions" id="choiceActions">
          <button class="btn btn-primary" id="revealButton" type="button" autofocus>Reveal account details</button>
          <button class="btn btn-secondary" id="issueButton" type="button">Report an account issue</button>
        </div>

        <div class="panel password-panel" id="passwordPanel" hidden>
          <label class="field-label" for="accessPassword">Enter your gift password</label>
          <input class="field-input" id="accessPassword" type="password" autocomplete="off" placeholder="Gift password" />
          <p class="form-message" id="formMessage" role="status"></p>
          <button class="btn btn-primary" id="submitPassword" type="button">Unlock</button>
          <button class="btn btn-quiet" id="backButton" type="button">&larr; Back</button>
        </div>

        <div class="panel success-panel" id="successPanel" hidden>
          <div class="success-icon" aria-hidden="true">✓</div>
          <h3 id="successTitle">All set!</h3>
          <p class="dialog-copy" id="successMessage"></p>
          <button class="btn btn-primary" value="close">Done</button>
        </div>
      </form>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
